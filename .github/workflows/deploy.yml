name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Tell Bing and other IndexNow engines that pages changed, so they recrawl right away.
      # The key file lives at /3cd5ebd390f90d4b6b751c61f8d213b0.txt. A failed ping never fails the deploy.
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          urls=$(curl -fsS https://ziqiwang-zoe.github.io/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s -c .)
          curl -sS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"ziqiwang-zoe.github.io\",\"key\":\"3cd5ebd390f90d4b6b751c61f8d213b0\",\"keyLocation\":\"https://ziqiwang-zoe.github.io/3cd5ebd390f90d4b6b751c61f8d213b0.txt\",\"urlList\":$urls}" \
            -w '\nIndexNow HTTP %{http_code}\n'
